<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ocrweb · 图片转文字</title>
<meta name="description" content="Free online OCR that runs 100% in your browser. 图片转文字，纯本地识别不上传，支持中文。">
<style>
  :root { --blue:#1a73e8; --bg:#f6f8fb; --card:#fff; --txt:#202124; --muted:#5f6368; --line:#e0e3e7; --green:#137333; --greenbg:#e6f4ea; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; display:flex; flex-direction:column; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10; }
  header .logo { font-size:24px; }
  header h1 { font-size:17px; font-weight:700; }
  header .sub { font-size:12px; color:var(--muted); }
  header .spacer { flex:1; }
  #langBtn { border:1px solid var(--line); background:#fff; border-radius:20px; padding:8px 16px; font-size:14px; cursor:pointer; color:var(--txt); min-height:40px; }
  #langBtn:hover { border-color:var(--blue); color:var(--blue); }
  main { flex:1; max-width:640px; width:100%; margin:0 auto; padding:12px; display:flex; flex-direction:column; gap:12px; }
  .privacy { background:var(--greenbg); border:1px solid #b7e0c3; color:var(--green); border-radius:12px; padding:10px 14px; font-size:13px; line-height:1.6; text-align:center; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  /* dropzone */
  #dropzone { border:2px dashed var(--line); text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  #dropzone:hover, #dropzone.over { border-color:var(--blue); background:#f0f6ff; }
  #dropzone.over { border-style:solid; }
  .dz-icon { font-size:44px; margin-bottom:8px; }
  .dz-title { font-size:16px; font-weight:700; margin-bottom:6px; }
  .dz-hint { font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:12px; }
  .dz-btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .dz-paste { margin-top:10px; font-size:12px; color:var(--muted); }
  .dz-paste kbd { background:#f1f3f4; border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-family:inherit; font-size:12px; }
  #dzPreview img { max-width:100%; max-height:320px; border-radius:10px; border:1px solid var(--line); display:block; margin:0 auto 10px; }
  /* language pills */
  .row-label { font-size:14px; font-weight:700; margin-bottom:10px; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; }
  .pills label { flex:1; min-width:120px; }
  .pills input { position:absolute; opacity:0; pointer-events:none; }
  .pills span { display:block; text-align:center; border:1.5px solid var(--line); border-radius:12px; padding:12px 8px; font-size:14px; font-weight:600; cursor:pointer; background:#fff; transition:all .15s; }
  .pills input:checked + span { border-color:var(--blue); background:#e8f0fe; color:#174ea6; }
  .lang-note { margin-top:10px; font-size:12px; color:var(--muted); line-height:1.6; }
  /* buttons */
  .btn { border:0; border-radius:14px; padding:14px 20px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; min-height:52px; }
  .btn-primary { background:var(--blue); color:#fff; box-shadow:0 2px 10px rgba(26,115,232,.35); width:100%; }
  .btn-primary:hover:not(:disabled) { background:#1765cc; }
  .btn-primary:disabled { opacity:.45; cursor:default; box-shadow:none; }
  .btn-ghost { background:#fff; color:var(--txt); border:1px solid var(--line); font-size:14px; padding:11px 16px; min-height:48px; }
  .btn-ghost:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); }
  .btn-ghost:disabled { opacity:.45; cursor:default; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .btnrow .btn-ghost { flex:1; min-width:110px; }
  /* progress */
  #progText { font-size:14px; margin-bottom:10px; text-align:center; color:var(--muted); }
  #progText b { color:var(--txt); }
  .bar { height:10px; background:#eef1f4; border-radius:6px; overflow:hidden; }
  #barFill { height:100%; width:0%; background:linear-gradient(90deg,#1a73e8,#6aa5ff); border-radius:6px; transition:width .2s; }
  /* result */
  .row-head { display:flex; align-items:center; font-size:14px; font-weight:700; margin-bottom:10px; }
  .row-head .count { margin-left:auto; font-weight:400; color:var(--muted); font-size:12px; }
  #result { width:100%; min-height:180px; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:14px; line-height:1.8; font-family:inherit; resize:vertical; outline:none; background:#fbfcfe; color:var(--txt); }
  #result:focus { border-color:var(--blue); }
  .err { background:#fce8e6; border:1px solid #f5c6c0; color:#a50e0e; border-radius:10px; padding:10px 14px; font-size:13px; line-height:1.7; display:none; }
  .err.show { display:block; }
  footer { text-align:center; padding:14px; font-size:12px; color:var(--muted); line-height:1.8; }
  footer a { color:var(--blue); text-decoration:none; }
</style>
</head>
<body>
<header>
  <span class="logo">📷</span>
  <div>
    <h1 data-i18n="title">ocrweb · 图片转文字</h1>
    <div class="sub" data-i18n="subtitle">截图 / 照片一键转文字</div>
  </div>
  <span class="spacer"></span>
  <button id="langBtn" aria-label="switch language">EN</button>
</header>
<main>
  <div class="privacy">🔒 <span data-i18n="privacy">100% 本地识别 · 图片不会上传到任何服务器</span></div>

  <div class="card" id="dropzone" role="button" tabindex="0" aria-label="select image">
    <input type="file" id="fileInput" accept="image/*" hidden>
    <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
    <div id="dzEmpty">
      <div class="dz-icon">🖼️</div>
      <div class="dz-title" data-i18n="dzTitle">拖拽图片到这里，或点击选择</div>
      <div class="dz-hint" data-i18n="dzHint">支持 JPG / PNG / BMP / WEBP<br>截图、照片、扫描件都可以</div>
      <div class="dz-btns">
        <button class="btn btn-ghost" id="pickBtn" type="button">📁 <span data-i18n="pickBtn">选择图片</span></button>
        <button class="btn btn-ghost" id="camBtn" type="button">📷 <span data-i18n="camBtn">拍照</span></button>
      </div>
      <div class="dz-paste" data-i18n="dzPaste">电脑上也可以直接 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴截图</div>
    </div>
    <div id="dzPreview" hidden>
      <img id="preview" alt="preview">
      <button class="btn btn-ghost" id="changeBtn" type="button">🔄 <span data-i18n="changeBtn">换一张</span></button>
    </div>
  </div>

  <div class="card">
    <div class="row-label" data-i18n="langLabel">🌐 识别语言</div>
    <div class="pills">
      <label><input type="radio" name="ocrLang" value="chi_sim" checked><span data-i18n="langZh">🇨🇳 中文</span></label>
      <label><input type="radio" name="ocrLang" value="eng"><span data-i18n="langEn">🇺🇸 English</span></label>
      <label><input type="radio" name="ocrLang" value="mix"><span data-i18n="langMix">🌏 中英混合</span></label>
    </div>
    <div class="lang-note" data-i18n="langNote">💡 首次使用中文识别需下载语言包（约 13 MB），下载一次后浏览器会自动缓存。</div>
  </div>

  <button class="btn btn-primary" id="goBtn" disabled>🔍 <span data-i18n="goBtn">开始识别</span></button>

  <div class="card" id="progCard" hidden>
    <div id="progText">…</div>
    <div class="bar"><div id="barFill"></div></div>
  </div>

  <div class="err" id="errBox"></div>

  <div class="card" id="resCard" hidden>
    <div class="row-head"><span data-i18n="resLabel">📝 识别结果</span><span class="count" id="resCount"></span></div>
    <textarea id="result" readonly data-i18n-ph="resPh" placeholder="识别出的文字会显示在这里…"></textarea>
    <div class="btnrow">
      <button class="btn btn-ghost" id="copyBtn">📋 <span data-i18n="copyBtn">复制</span></button>
      <button class="btn btn-ghost" id="dlBtn">⬇ <span data-i18n="dlBtn">下载 .txt</span></button>
      <button class="btn btn-ghost" id="clearBtn">🗑 <span data-i18n="clearBtn">清空重来</span></button>
    </div>
  </div>
</main>
<footer>
  <span data-i18n="footer">ocrweb · 基于 tesseract.js，图片仅在浏览器本地处理</span><br>
  <a href="https://github.com/muse-ai-assistant/ocrweb" target="_blank" rel="noopener">GitHub</a>
</footer>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
"use strict";
/* ================= i18n ================= */
const I18N = {
  zh: {
    title: "ocrweb · 图片转文字", subtitle: "截图 / 照片一键转文字",
    privacy: "100% 本地识别 · 图片不会上传到任何服务器",
    dzTitle: "拖拽图片到这里，或点击选择",
    dzHint: "支持 JPG / PNG / BMP / WEBP<br>截图、照片、扫描件都可以",
    pickBtn: "选择图片", camBtn: "拍照",
    dzPaste: '电脑上也可以直接 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴截图',
    changeBtn: "换一张",
    langLabel: "🌐 识别语言", langZh: "🇨🇳 中文", langEn: "🇺🇸 English", langMix: "🌏 中英混合",
    langNote: "💡 首次使用中文识别需下载语言包（约 13 MB），下载一次后浏览器会自动缓存。",
    goBtn: "开始识别", recognizing: "识别中…",
    resLabel: "📝 识别结果", resPh: "识别出的文字会显示在这里…",
    copyBtn: "复制", copied: "✅ 已复制", copyFail: "❌ 复制失败，请手动复制",
    dlBtn: "下载 .txt", clearBtn: "清空重来",
    chars: (n) => `共 ${n} 字`,
    emptyResult: "（没有识别出文字，试试更清晰的图片）",
    footer: "ocrweb · 基于 tesseract.js，图片仅在浏览器本地处理",
    stLoadingCore: "正在加载识别引擎…",
    stInitTess: "正在初始化识别引擎…",
    stLoadingLang: "正在下载语言包（首次约 13 MB，请稍候）…",
    stInitApi: "正在准备识别…",
    stRecognizing: "正在识别图片文字…",
    stDone: "识别完成",
    errNoLib: "❌ 识别引擎加载失败，请检查网络后刷新重试（需要从 CDN 加载 tesseract.js）。",
    errNoImg: "请先选择一张图片。",
    errBusy: "正在识别中，请稍候…",
    errFail: "❌ 识别失败：",
  },
  en: {
    title: "ocrweb · Image to Text", subtitle: "Turn screenshots / photos into text",
    privacy: "100% on-device OCR · images never leave your browser",
    dzTitle: "Drag & drop an image here, or tap to select",
    dzHint: "JPG / PNG / BMP / WEBP supported<br>Screenshots, photos, scans — all fine",
    pickBtn: "Choose image", camBtn: "Camera",
    dzPaste: 'On desktop you can also paste a screenshot with <kbd>Ctrl</kbd>+<kbd>V</kbd>',
    changeBtn: "Change image",
    langLabel: "🌐 OCR language", langZh: "🇨🇳 Chinese", langEn: "🇺🇸 English", langMix: "🌏 Chinese+English",
    langNote: "💡 First-time Chinese OCR downloads a language pack (~13 MB); your browser caches it afterwards.",
    goBtn: "Recognize", recognizing: "Recognizing…",
    resLabel: "📝 Result", resPh: "Recognized text will appear here…",
    copyBtn: "Copy", copied: "✅ Copied", copyFail: "❌ Copy failed, please copy manually",
    dlBtn: "Download .txt", clearBtn: "Start over",
    chars: (n) => `${n} chars`,
    emptyResult: "(No text recognized — try a clearer image)",
    footer: "ocrweb · Powered by tesseract.js, images processed locally in your browser",
    stLoadingCore: "Loading OCR engine…",
    stInitTess: "Initializing OCR engine…",
    stLoadingLang: "Downloading language pack (~13 MB on first run, please wait)…",
    stInitApi: "Preparing…",
    stRecognizing: "Recognizing text in image…",
    stDone: "Done",
    errNoLib: "❌ Failed to load the OCR engine. Check your network and refresh (tesseract.js loads from CDN).",
    errNoImg: "Please choose an image first.",
    errBusy: "Recognition in progress, please wait…",
    errFail: "❌ Recognition failed: ",
  }
};
let uiLang = "zh";
const $ = (id) => document.getElementById(id);
function applyLang() {
  const t = I18N[uiLang];
  document.documentElement.lang = uiLang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const k = el.getAttribute("data-i18n");
    if (t[k] !== undefined && typeof t[k] === "string") el.innerHTML = t[k];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
    const k = el.getAttribute("data-i18n-ph");
    if (t[k] !== undefined) el.placeholder = t[k];
  });
  $("langBtn").textContent = uiLang === "zh" ? "EN" : "中文";
  document.title = t.title;
  updateCount();
}

/* ================= state ================= */
let imgFile = null, imgURL = null, busy = false;
const workers = {}; // ocrLang value -> Tesseract worker

const els = {};
["dropzone","fileInput","camInput","dzEmpty","dzPreview","preview","pickBtn","camBtn","changeBtn",
 "goBtn","progCard","progText","barFill","resCard","result","resCount","copyBtn","dlBtn","clearBtn",
 "errBox","langBtn"].forEach((id) => (els[id] = $(id)));

/* ================= image input ================= */
function setImage(file) {
  if (!file || !file.type.startsWith("image/")) return;
  if (imgURL) URL.revokeObjectURL(imgURL);
  imgFile = file;
  imgURL = URL.createObjectURL(file);
  els.preview.src = imgURL;
  els.dzEmpty.hidden = true;
  els.dzPreview.hidden = false;
  els.goBtn.disabled = false;
  hideErr();
}
function clearAll() {
  if (imgURL) URL.revokeObjectURL(imgURL);
  imgFile = null; imgURL = null;
  els.fileInput.value = ""; els.camInput.value = "";
  els.preview.removeAttribute("src");
  els.dzEmpty.hidden = false;
  els.dzPreview.hidden = true;
  els.goBtn.disabled = true;
  els.progCard.hidden = true;
  els.resCard.hidden = true;
  els.result.value = "";
  hideErr();
}
function pickFile() { els.fileInput.click(); }
els.pickBtn.addEventListener("click", (e) => { e.stopPropagation(); pickFile(); });
els.camBtn.addEventListener("click", (e) => { e.stopPropagation(); els.camInput.click(); });
els.changeBtn.addEventListener("click", (e) => { e.stopPropagation(); pickFile(); });
els.dropzone.addEventListener("click", () => {
  if (!els.dzPreview.hidden) return;
  pickFile();
});
els.dropzone.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && !els.dzEmpty.hidden) { e.preventDefault(); pickFile(); }
});
els.fileInput.addEventListener("change", () => setImage(els.fileInput.files[0]));
els.camInput.addEventListener("change", () => setImage(els.camInput.files[0]));
["dragenter","dragover"].forEach((ev) => els.dropzone.addEventListener(ev, (e) => {
  e.preventDefault(); els.dropzone.classList.add("over");
}));
["dragleave","drop"].forEach((ev) => els.dropzone.addEventListener(ev, (e) => {
  e.preventDefault(); els.dropzone.classList.remove("over");
}));
els.dropzone.addEventListener("drop", (e) => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) setImage(f);
});
document.addEventListener("paste", (e) => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items) {
    if (it.type.startsWith("image/")) {
      const f = it.getAsFile();
      if (f) { setImage(f); e.preventDefault(); }
      break;
    }
  }
});

/* ================= OCR ================= */
function showErr(msg) { els.errBox.textContent = msg; els.errBox.classList.add("show"); }
function hideErr() { els.errBox.classList.remove("show"); }
function setProgress(pct, textKey) {
  els.progCard.hidden = false;
  els.barFill.style.width = Math.max(0, Math.min(100, pct)) + "%";
  els.progText.innerHTML = "<b>" + Math.round(pct) + "%</b> " + I18N[uiLang][textKey];
}
function ocrLangValue() {
  const r = document.querySelector('input[name="ocrLang"]:checked');
  return r ? r.value : "chi_sim";
}
async function getWorker() {
  const key = ocrLangValue();
  if (workers[key]) return workers[key];
  if (typeof Tesseract === "undefined") throw new Error(I18N[uiLang].errNoLib);
  const langs = key === "mix" ? ["chi_sim", "eng"] : [key];
  setProgress(2, "stLoadingLang");
  const worker = await Tesseract.createWorker(langs, 1, {
    logger: (m) => {
      const p = Math.round((m.progress || 0) * 100);
      const map = {
        "loading tesseract core": ["stLoadingCore", 5],
        "initializing tesseract": ["stInitTess", 12],
        "loading language traineddata": ["stLoadingLang", 15 + p * 0.5],
        "initializing api": ["stInitApi", 70],
        "recognizing text": ["stRecognizing", 70 + p * 0.3],
      };
      const hit = map[m.status];
      if (hit) setProgress(hit[1], hit[0]);
    },
  });
  workers[key] = worker;
  return worker;
}
async function doRecognize() {
  const t = I18N[uiLang];
  if (busy) { showErr(t.errBusy); return; }
  if (!imgFile) { showErr(t.errNoImg); return; }
  if (typeof Tesseract === "undefined") { showErr(t.errNoLib); return; }
  busy = true;
  els.goBtn.disabled = true;
  els.resCard.hidden = true;
  hideErr();
  try {
    const worker = await getWorker();
    const { data } = await worker.recognize(imgFile);
    const text = (data.text || "").trim();
    els.result.value = text || t.emptyResult;
    setProgress(100, "stDone");
    els.resCard.hidden = false;
    updateCount();
    setTimeout(() => { els.resCard.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 150);
  } catch (err) {
    showErr(t.errFail + (err && err.message ? err.message : err));
    els.progCard.hidden = true;
  } finally {
    busy = false;
    els.goBtn.disabled = !imgFile;
  }
}
els.goBtn.addEventListener("click", doRecognize);

/* ================= result actions ================= */
function updateCount() {
  const n = els.result.value.length;
  els.resCount.textContent = n ? I18N[uiLang].chars(n) : "";
}
els.result.addEventListener("input", updateCount);
els.copyBtn.addEventListener("click", async () => {
  const t = I18N[uiLang];
  const label = els.copyBtn.querySelector("span");
  try {
    await navigator.clipboard.writeText(els.result.value);
    label.textContent = t.copied;
  } catch (e) {
    els.result.select();
    try {
      document.execCommand("copy");
      label.textContent = t.copied;
    } catch (e2) {
      showErr(t.copyFail); return;
    }
  }
  setTimeout(() => { label.textContent = t.copyBtn; }, 1500);
});
els.dlBtn.addEventListener("click", () => {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const name = `ocrweb-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.txt`;
  const blob = new Blob([els.result.value], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
});
els.clearBtn.addEventListener("click", clearAll);
els.langBtn.addEventListener("click", () => {
  uiLang = uiLang === "zh" ? "en" : "zh";
  applyLang();
});

applyLang();
</script>
</body>
</html>
